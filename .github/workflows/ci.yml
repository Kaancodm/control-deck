name: CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: controldeck
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DECK_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/controldeck_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Create test database
        run: |
          sudo apt-get install -y -qq postgresql-client
          psql "postgresql://postgres@localhost:5432/postgres" -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'controldeck_test'" | grep -q 1 \
            || psql "postgresql://postgres@localhost:5432/postgres" -c \
            "CREATE DATABASE controldeck_test"

      - name: Alembic upgrade and check
        run: |
          uv run alembic -x target=test upgrade head
          uv run alembic -x target=test check

      - name: Claude hook and settings tests
        run: |
          bash tests/hooks/test_guard.sh
          bash tests/hooks/test_settings.sh

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app/

      - name: Pytest
        run: uv run pytest
