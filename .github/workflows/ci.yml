name: CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: controldeck
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DECK_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/controldeck_test
      DECK_KB_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/deck_kb_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Create test database
        run: |
          sudo apt-get install -y -qq postgresql-client
          psql "postgresql://postgres@localhost:5432/postgres" -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'controldeck_test'" | grep -q 1 \
            || psql "postgresql://postgres@localhost:5432/postgres" -c \
            "CREATE DATABASE controldeck_test"
          psql "postgresql://postgres@localhost:5432/postgres" -c \
            "CREATE DATABASE deck_kb_test"

      - name: Alembic upgrade and check
        run: |
          uv run alembic -x target=test upgrade head
          uv run alembic -x target=test check
          uv run alembic -c alembic_kb.ini upgrade head
          uv run alembic -c alembic_kb.ini check

      - name: Match dump and restore clients to the test server
        env:
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci_pg_clients.sh

      - name: Claude hook and settings tests
        run: |
          bash tests/hooks/test_guard.sh
          bash tests/hooks/test_settings.sh

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app/

      - name: Pytest
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest
