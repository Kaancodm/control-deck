# Local policy ceilings count committed claims, not provider quota estimates.
# Models are configured locally before activating a real adapter; none are downloaded.
version: 1
lanes:
  ollama:
    enabled: true
    daily_attempt_limit: null
    models: {}
  claude:
    enabled: true
    daily_attempt_limit: null
    models: {}
  # Disabled by owner decision (2026-11-04): no active Codex account.
  # Claude remains the active cloud lane; re-enable only with a working account.
  codex:
    enabled: false
    daily_attempt_limit: null
    models: {}
# First matching rule can only restrict the task's worker set.
rules: []
